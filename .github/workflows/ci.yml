# CI for gscoop (module github.com/TheSlopMachine/gscoop, go 1.22, Windows-first, CGO_ENABLED=0).
#
# golangci-lint is intentionally not a required job here. .golangci.yml ships
# for optional local runs (see CONTRIBUTING.md). The required gates below are
# chosen so they cannot false-fail on linter version drift.

name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: gofmt gate (fail on output)
        shell: pwsh
        run: |
          $out = gofmt -l .
          if ($out) {
            Write-Output $out
            exit 1
          }
